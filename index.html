<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>富士山 配車ルーレット</title>
<style>
:root{
  --bg:#08111f;--card:#132033;--line:#29405f;--text:#f8fafc;--muted:#cbd5e1;
  --yellow:#facc15;--orange:#f97316;--red:#ef4444;--purple:#a855f7;--blue:#38bdf8;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;
  color:var(--text);background:
  radial-gradient(circle at 20% 10%,rgba(56,189,248,.16),transparent 28%),
  radial-gradient(circle at 80% 0%,rgba(249,115,22,.14),transparent 30%),
  linear-gradient(160deg,#07101d,#101b2f 60%,#08111f);
}
.wrap{width:min(960px,92vw);margin:auto;padding:28px 0 60px}
header{text-align:center;margin-bottom:22px}
.kicker{display:inline-block;padding:7px 11px;border:1px solid var(--line);border-radius:999px;color:var(--muted);font-size:12px}
h1{font-size:clamp(34px,7vw,58px);line-height:1.05;margin:14px 0 8px}
.lead{margin:0;color:var(--muted);line-height:1.7}
.panel{
  background:rgba(19,32,51,.94);border:1px solid var(--line);border-radius:24px;padding:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.32)
}
.members{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.member{background:#1e314b;border:1px solid #304b6c;padding:12px;border-radius:13px;text-align:center;font-weight:800}
.member small{display:block;color:var(--muted);font-size:11px;margin-top:4px;font-weight:500}
.controls{text-align:center;margin-top:22px}
button{
  border:0;border-radius:16px;padding:17px 25px;font-size:18px;font-weight:900;cursor:pointer;
  background:linear-gradient(135deg,var(--yellow),var(--orange));color:#111827;
  box-shadow:0 12px 28px rgba(249,115,22,.32)
}
button:disabled{opacity:.6;cursor:not-allowed}
.status{min-height:28px;margin-top:14px;color:#fde047;font-weight:900}
.result{display:none;grid-template-columns:1fr;gap:16px;margin-top:20px}
.car{background:#0d1727;border:1px solid #314865;border-radius:19px;padding:18px}
.car h2{margin:0 0 12px;font-size:24px}
.person{display:flex;justify-content:space-between;gap:12px;align-items:center;background:#20334c;padding:12px 13px;border-radius:12px;margin:8px 0;font-weight:800}
.driver{background:#6b3d0b;border:1px solid var(--yellow)}
.fake{background:#3b1760;border:1px solid #c084fc}
.badge{font-size:11px;font-weight:900;padding:5px 8px;border-radius:999px;background:var(--yellow);color:#111827}
.fake-badge{background:#c084fc;color:#1e0a30}
.message{margin-top:14px;border-radius:14px;padding:15px;line-height:1.8;font-weight:800;background:#3b0b0b;border:1px solid var(--red);color:#fee2e2}
.message.rare{background:#442006;border-color:var(--yellow);color:#fef3c7;box-shadow:0 0 25px rgba(250,204,21,.18)}
.message.mori{background:#2b0b4f;border-color:#a855f7;color:#f3e8ff}
.note{margin-top:16px;color:var(--muted);font-size:12px;line-height:1.6;text-align:center}

/* Intro animation */
.intro{
  position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:9999;
  background:linear-gradient(#9ad8ff 0 45%,#7fb9e0 45% 56%,#244d38 56% 100%);
  overflow:hidden
}
.scene{position:absolute;inset:0}
.sun{position:absolute;right:9%;top:9%;width:74px;height:74px;border-radius:50%;background:#fff3a1;box-shadow:0 0 60px rgba(255,243,161,.9)}
.fuji{
  position:absolute;left:50%;bottom:18%;transform:translateX(-50%);
  width:min(780px,110vw);height:56vh;
  clip-path:polygon(50% 0,100% 100%,0 100%);
  background:linear-gradient(to bottom,#f8fafc 0 17%,#dbeafe 17% 25%,#64748b 25% 100%);
}
.fuji:after{
  content:"";position:absolute;left:17%;right:17%;top:18%;height:18%;
  background:#e2e8f0;clip-path:polygon(0 0,14% 42%,28% 15%,42% 60%,55% 20%,67% 52%,82% 12%,100% 0,100% 100%,0 100%)
}
.road{
  position:absolute;left:50%;bottom:-8%;transform:translateX(-50%);
  width:46%;height:68%;background:#243447;
  clip-path:polygon(43% 0,57% 0,100% 100%,0 100%);
}
.road:after{
  content:"";position:absolute;left:49%;top:0;width:2%;height:100%;
  background:repeating-linear-gradient(to bottom,#fff 0 24px,transparent 24px 48px)
}
.car-anim{
  position:absolute;left:50%;bottom:6%;transform:translateX(-50%);
  width:82px;height:42px;border-radius:14px 14px 7px 7px;background:#f97316;
  box-shadow:0 10px 18px rgba(0,0,0,.35);
  animation:climb 3.5s linear forwards
}
.car-anim:before,.car-anim:after{
  content:"";position:absolute;bottom:-8px;width:18px;height:18px;border-radius:50%;background:#111827
}
.car-anim:before{left:10px}.car-anim:after{right:10px}
.car-anim .glass{position:absolute;left:14px;right:14px;top:7px;height:14px;border-radius:7px 7px 3px 3px;background:#bde9ff}
.climb-label{
  position:absolute;left:50%;top:8%;transform:translateX(-50%);
  font-size:clamp(24px,6vw,44px);font-weight:1000;color:#10233a;text-align:center;text-shadow:0 2px 0 rgba(255,255,255,.45)
}
.countdown{
  position:absolute;left:50%;bottom:8%;transform:translateX(-50%);
  font-size:20px;font-weight:1000;color:white;background:rgba(0,0,0,.4);padding:10px 16px;border-radius:999px
}
@keyframes climb{
  0%{bottom:5%;transform:translateX(-50%) scale(1)}
  100%{bottom:55%;transform:translateX(-50%) scale(.42)}
}
.flash{animation:flash .65s ease}
@keyframes flash{0%,100%{filter:none}35%{filter:brightness(2.3)}}
@media(min-width:720px){
  .members{grid-template-columns:repeat(3,1fr)}
  .result{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <span class="kicker">FUJI DRIVER ROULETTE</span>
  <h1>富士山 配車ルーレット</h1>
  <p class="lead">3人・3人 または 4人・2人で配車。運転手交代のたびに使えます。</p>
</header>

<section class="panel">
  <div class="members">
    <div class="member">いっせい<small>運転手候補</small></div>
    <div class="member">そえじま<small>運転手になると改名</small></div>
    <div class="member">こうじま<small>運転手候補</small></div>
    <div class="member">わなみ<small>運転手候補</small></div>
    <div class="member">もりっそ<small>当選後に責任転嫁</small></div>
    <div class="member">やっすん<small>運転手候補</small></div>
  </div>

  <div class="controls">
    <button id="spinBtn" onclick="runRoulette()">ルーレットを回す</button>
    <div class="status" id="status">運転したい人からどうぞ。</div>
  </div>

  <div class="result" id="result">
    <article class="car" id="car1"></article>
    <article class="car" id="car2"></article>
  </div>

  <div class="note">※レア煽りは低確率で表示されます。もりっそが当たった場合は、同じ車の別メンバーへ運転を押しつけます。</div>
</section>
</div>

<div class="intro" id="intro">
  <div class="scene">
    <div class="sun"></div>
    <div class="fuji"></div>
    <div class="road"></div>
    <div class="car-anim"><div class="glass"></div></div>
    <div class="climb-label">富士山へ向かっています…</div>
    <div class="countdown" id="countdown">結果発表まで 3.5秒</div>
  </div>
</div>

<script>
var members=[
  {name:"いっせい",canDrive:true},
  {name:"そえじま",canDrive:true},
  {name:"こうじま",canDrive:true},
  {name:"わなみ",canDrive:true},
  {name:"もりっそ",canDrive:false},
  {name:"やっすん",canDrive:true}
];

var normalLines=[
  function(n){return "😌 「"+n+"、運転したかったのになー。そこまで運転したいなら譲るわ。」";},
  function(n){return "😂 「"+n+"、運転好きだねー。富士山登るだけでも辛いのに、わざわざ運転までやるなんて本当にもの好きだねー。」";},
  function(n){return "👏 「"+n+"、運転席に合うね。もうそのまま固定席でいいんじゃない？」";},
  function(n){return "🚗 「"+n+"、運転が様になってきたんじゃない？回数こなしてるだけあるねー。」";},
  function(n){return "😇 「"+n+"って運転なんてするの？もの好きだねー。こっちは登山に集中したいから助かるわ。」";},
  function(n){return "🏔️ 「"+n+"、そこまで運転したいなら譲るよ。運転好きな人の楽しみを奪うのも悪いしね。」";}
];

var rareLines=[
  function(n){return "✨ レア煽り：「もう"+n+"だけで良くないですか？」";},
  function(n){return "✨ レア煽り：「もう2度と運転しねぇから。文句あるか、"+n+"。」";},
  function(n){return "✨ レア煽り：「運転がほんとうに好きなんだね。ふぁ　い　と😘」";},
  function(n){return "✨ レア煽り：「運転ってバカがやるものだと思ってた。あぁ、"+n+"はバカだからか。」";},
  function(n){return "✨ レア煽り：「この前運転したいって言ってたもんね。ちょうどよかったじゃん。喜べよ。」";},
  function(n){return "✨ レア煽り：「どうせ運転するんなら、ルーレットに頼らず自分から立候補しろよ。」";},
  function(n){return "✨ レア煽り：「そんなに運転好きならもう車買えよ。あぁ、買うお金ないか。おもろ。」";},
  function(n){return "✨ レア煽り：「運転下手くそなんだし、この機会に上手くなれよ、少年。」";}
];

var moriLines=[
  function(real){return "😌 もりっそ「僕は運転ができないので、運転手は "+real+" にお願いしようかな。運転できないの残念だなー。本当は運転したかったんだけどなー。」";},
  function(real){return "🎭 もりっそ「せっかく当たったのに、僕は運転できないから "+real+" に譲ってあげる。運転したかったのになー。いやー本当に残念。」";},
  function(real){return "👏 もりっそ「僕が運転手かー。あ、免許なかった。じゃあ "+real+" お願い。僕は後ろで応援してるね。運転できないの残念だなー。」";}
];

function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function pick(arr){return arr[Math.floor(Math.random()*arr.length)]}

function displayName(name){
  return name==="そえじま" ? "運転島好き大" : name;
}

function driverResult(group){
  var selected=pick(group);
  if(selected.name==="もりっそ"){
    var candidates=group.filter(function(p){return p.canDrive});
    var real=pick(candidates);
    return {actual:real, nominal:selected, mori:true, rare:false, text:pick(moriLines)(displayName(real.name))};
  }
  var rare=Math.random()<0.18;
  var shown=displayName(selected.name);
  return {actual:selected,nominal:selected,mori:false,rare:rare,text:(rare?pick(rareLines):pick(normalLines))(shown)};
}

function renderCar(num,group,res){
  var html="<h2>🚙 車"+num+"（"+group.length+"人）</h2>";
  group.forEach(function(p){
    var isActual=p.name===res.actual.name;
    var isFake=res.mori && p.name==="もりっそ";
    var cls="person"+(isActual?" driver":"")+(isFake?" fake":"");
    var badge="";
    if(isActual) badge='<span class="badge">運転手</span>';
    if(isFake) badge='<span class="badge fake-badge">責任転嫁</span>';
    html+='<div class="'+cls+'"><span>'+displayName(p.name)+'</span>'+badge+'</div>';
  });
  html+='<div class="message '+(res.rare?"rare ":"")+(res.mori?"mori":"")+'">'+res.text+"</div>";
  return html;
}

function runRoulette(){
  var btn=document.getElementById("spinBtn");
  var intro=document.getElementById("intro");
  var result=document.getElementById("result");
  var status=document.getElementById("status");
  var countdown=document.getElementById("countdown");

  btn.disabled=true;
  result.style.display="none";
  intro.style.display="flex";
  status.textContent="富士山へ向かっています…";

  var remaining=3.5;
  countdown.textContent="結果発表まで 3.5秒";
  var timer=setInterval(function(){
    remaining-=0.5;
    if(remaining>0){countdown.textContent="結果発表まで "+remaining.toFixed(1)+"秒";}
  },500);

  setTimeout(function(){
    clearInterval(timer);
    intro.classList.add("flash");

    var mixed=shuffle(members);
    var split=Math.random()<0.5 ? 3 : (Math.random()<0.5 ? 2 : 4);
    var g1=mixed.slice(0,split),g2=mixed.slice(split);
    var d1=driverResult(g1),d2=driverResult(g2);

    document.getElementById("car1").innerHTML=renderCar(1,g1,d1);
    document.getElementById("car2").innerHTML=renderCar(2,g2,d2);

    setTimeout(function(){
      intro.style.display="none";
      intro.classList.remove("flash");
      result.style.display="grid";
      status.textContent="配車決定。運転したかった人、おめでとうございます。";
      btn.textContent="もう一度回す";
      btn.disabled=false;
    },450);
  },3500);
}
</script>
</body>
</html>
