<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>富士山 配車ルーレット</title>
<style>
:root{
  --bg:#08111f;
  --card:#132033;
  --line:#29405f;
  --text:#f8fafc;
  --muted:#cbd5e1;
  --yellow:#facc15;
  --orange:#f97316;
  --red:#ef4444;
  --purple:#a855f7;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Yu Gothic",sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 20% 10%,rgba(56,189,248,.14),transparent 28%),
    radial-gradient(circle at 80% 0%,rgba(249,115,22,.12),transparent 30%),
    linear-gradient(160deg,#07101d,#101b2f 60%,#08111f);
}
.wrap{
  width:min(960px,92vw);
  margin:auto;
  padding:28px 0 60px;
}
header{text-align:center;margin-bottom:22px}
.kicker{
  display:inline-block;
  padding:7px 11px;
  border:1px solid var(--line);
  border-radius:999px;
  color:var(--muted);
  font-size:12px;
}
h1{
  font-size:clamp(34px,7vw,58px);
  line-height:1.05;
  margin:14px 0 8px;
}
.lead{
  margin:0;
  color:var(--muted);
  line-height:1.7;
}
.panel{
  background:rgba(19,32,51,.95);
  border:1px solid var(--line);
  border-radius:24px;
  padding:18px;
  box-shadow:0 24px 70px rgba(0,0,0,.32);
}
.members{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}
.member{
  background:#1e314b;
  border:1px solid #304b6c;
  padding:12px;
  border-radius:13px;
  text-align:center;
  font-weight:800;
}
.member small{
  display:block;
  color:var(--muted);
  font-size:11px;
  margin-top:4px;
  font-weight:500;
}
.controls{text-align:center;margin-top:22px}
button{
  border:0;
  border-radius:16px;
  padding:17px 25px;
  font-size:18px;
  font-weight:900;
  cursor:pointer;
  background:linear-gradient(135deg,var(--yellow),var(--orange));
  color:#111827;
  box-shadow:0 12px 28px rgba(249,115,22,.32);
}
button:disabled{opacity:.6;cursor:not-allowed}
.status{
  min-height:28px;
  margin-top:14px;
  color:#fde047;
  font-weight:900;
}
.result{
  display:none;
  grid-template-columns:1fr;
  gap:16px;
  margin-top:20px;
}
.car{
  background:#0d1727;
  border:1px solid #314865;
  border-radius:19px;
  padding:18px;
}
.car h2{margin:0 0 12px;font-size:24px}
.person{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:center;
  background:#20334c;
  padding:12px 13px;
  border-radius:12px;
  margin:8px 0;
  font-weight:800;
}
.driver{
  background:#6b3d0b;
  border:1px solid var(--yellow);
}
.fake{
  background:#3b1760;
  border:1px solid #c084fc;
}
.badge{
  font-size:11px;
  font-weight:900;
  padding:5px 8px;
  border-radius:999px;
  background:var(--yellow);
  color:#111827;
}
.fake-badge{
  background:#c084fc;
  color:#1e0a30;
}
.message{
  margin-top:14px;
  border-radius:14px;
  padding:15px;
  line-height:1.8;
  font-weight:800;
  background:#3b0b0b;
  border:1px solid var(--red);
  color:#fee2e2;
}
.message.rare{
  background:#442006;
  border-color:var(--yellow);
  color:#fef3c7;
  box-shadow:0 0 25px rgba(250,204,21,.18);
}
.message.mori{
  background:#2b0b4f;
  border-color:#a855f7;
  color:#f3e8ff;
}

/* チンチロ演出 */
.intro{
  position:fixed;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  z-index:9999;
  background:
    radial-gradient(circle at center,rgba(255,255,255,.08),transparent 48%),
    linear-gradient(160deg,#121212,#2a1f1a 60%,#111);
  overflow:hidden;
}
.chinchiro-wrap{
  width:min(92vw,620px);
  text-align:center;
}
.chinchiro-title{
  margin-bottom:20px;
  font-size:clamp(24px,5vw,40px);
  font-weight:1000;
  letter-spacing:.06em;
  text-shadow:0 3px 12px rgba(0,0,0,.5);
}
.bowl{
  position:relative;
  width:min(86vw,520px);
  aspect-ratio:1/1;
  height:auto;
  margin:auto;
  border-radius:50%;
  background:
    radial-gradient(ellipse at 50% 26%,#69452e 0 8%,#4a2e1c 38%,#2b190f 72%,#170d08 100%);
  border:14px solid #25150d;
  box-shadow:
    inset 0 18px 32px rgba(255,255,255,.08),
    inset 0 -24px 38px rgba(0,0,0,.55),
    0 22px 40px rgba(0,0,0,.55);
  overflow:hidden;
}
.bowl:after{
  content:"";
  position:absolute;
  left:8%;
  right:8%;
  top:9%;
  height:25%;
  border-radius:50%;
  border-top:5px solid rgba(255,255,255,.11);
}
.dice{
  position:absolute;
  width:72px;
  height:72px;
  border-radius:14px;
  background:linear-gradient(145deg,#fff,#e5e7eb);
  box-shadow:0 10px 16px rgba(0,0,0,.45),inset 0 0 0 2px rgba(0,0,0,.08);
  transition:left .25s ease,top .25s ease,transform .25s ease;
}
.dice.rolling{animation:shakeDice .18s linear infinite}
@keyframes shakeDice{
  0%{transform:translate(0,0) rotate(0deg)}
  25%{transform:translate(6px,-7px) rotate(22deg)}
  50%{transform:translate(-5px,5px) rotate(-18deg)}
  75%{transform:translate(7px,4px) rotate(14deg)}
  100%{transform:translate(0,0) rotate(0deg)}
}
.dot{
  position:absolute;
  width:14px;
  height:14px;
  border-radius:50%;
  background:#111827;
}
.p1{left:12px;top:12px}
.p2{left:29px;top:12px}
.p3{right:12px;top:12px}
.p4{left:12px;top:29px}
.p5{left:29px;top:29px}
.p6{right:12px;top:29px}
.p7{left:12px;bottom:12px}
.p8{left:29px;bottom:12px}
.p9{right:12px;bottom:12px}
.countdown{
  margin-top:22px;
  display:inline-block;
  padding:10px 16px;
  border-radius:999px;
  background:rgba(0,0,0,.38);
  font-size:18px;
  font-weight:1000;
}
.flash{animation:flash .55s ease}
@keyframes flash{
  0%,100%{filter:none}
  35%{filter:brightness(2.7)}
}

@media(min-width:720px){
  .members{grid-template-columns:repeat(3,1fr)}
  .result{grid-template-columns:1fr 1fr}
}
@media(max-width:520px){
  .dice{width:58px;height:58px;border-radius:12px}
  .dot{width:11px;height:11px}
  .p1{left:10px;top:10px}.p2{left:24px;top:10px}.p3{right:10px;top:10px}
  .p4{left:10px;top:24px}.p5{left:24px;top:24px}.p6{right:10px;top:24px}
  .p7{left:10px;bottom:10px}.p8{left:24px;bottom:10px}.p9{right:10px;bottom:10px}
}

/* 結果専用画面：初期画面を隠し、スマホ1画面に収まりやすくする */
.result-stage{
  display:none;
  width:100%;
  min-height:100svh;
  padding:8px 8px 20px;
}
.result-status{
  margin:0 0 6px;
  min-height:20px;
  text-align:center;
  color:#fde047;
  font-size:clamp(12px,3.4vw,16px);
  line-height:1.25;
  font-weight:900;
}
.result-stage .result{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin:0;
  align-items:start;
}
.result-stage .car{
  min-width:0;
  padding:8px;
  border-radius:14px;
}
.result-stage .car h2{
  margin:0 0 6px;
  font-size:clamp(15px,4vw,20px);
  line-height:1.15;
}
.result-stage .person{
  min-width:0;
  gap:5px;
  padding:7px 7px;
  margin:4px 0;
  border-radius:9px;
  font-size:clamp(12px,3.4vw,16px);
  line-height:1.15;
}
.result-stage .person > span:first-child{
  overflow-wrap:anywhere;
}
.result-stage .badge{
  flex:0 0 auto;
  padding:4px 6px;
  font-size:clamp(8px,2.3vw,10px);
}
.result-stage .message{
  margin-top:6px;
  padding:8px;
  border-radius:10px;
  font-size:clamp(10px,2.7vw,13px);
  line-height:1.38;
  overflow-wrap:anywhere;
}
.result-actions{
  display:flex;
  justify-content:center;
  padding:16px 0 8px;
}
.result-actions button{
  font-size:16px;
  padding:14px 22px;
}
.setup-hidden{display:none!important}

/* もりっそ責任転嫁演出 */
.mori-chaos{
  position:fixed;
  inset:0;
  z-index:12000;
  display:none;
  overflow:hidden;
  background:rgba(10,5,20,.80);
  backdrop-filter:blur(2px);
}
.mori-chaos.active{display:block}
.mori-face{
  position:absolute;
  top:-160px;
  border-radius:50%;
  filter:drop-shadow(0 8px 8px rgba(0,0,0,.5));
  animation:moriFall var(--duration) cubic-bezier(.16,.8,.28,1) var(--delay) forwards;
}
@keyframes moriFall{
  0%{transform:translateY(-20vh) rotate(0deg) scale(.5);opacity:0}
  12%{opacity:1}
  82%{transform:translateY(var(--fall)) rotate(var(--rotate)) scale(1)}
  100%{transform:translateY(var(--fall)) rotate(var(--rotate)) scale(1);opacity:1}
}
.mori-chaos.explode .mori-face{
  animation:moriExplode .62s ease-out forwards!important;
}
@keyframes moriExplode{
  0%{opacity:1;transform:translateY(var(--fall)) rotate(var(--rotate)) scale(1)}
  35%{opacity:1;transform:translateY(var(--fall)) rotate(calc(var(--rotate) + 90deg)) scale(1.55)}
  100%{opacity:0;transform:translate(var(--blast-x),var(--blast-y)) rotate(540deg) scale(.15)}
}
.mori-flash{
  position:absolute;
  inset:0;
  display:grid;
  place-items:center;
  pointer-events:none;
  opacity:0;
  background:radial-gradient(circle,#fff 0 5%,#facc15 8%,#f97316 22%,rgba(168,85,247,.88) 42%,rgba(0,0,0,0) 72%);
  transform:scale(.25);
}
.mori-chaos.explode .mori-flash{
  animation:moriFlash .72s ease-out forwards;
}
.mori-flash strong{
  font-size:clamp(28px,9vw,68px);
  color:white;
  text-shadow:0 4px 0 #3b0764,0 0 20px #fff;
}
@keyframes moriFlash{
  0%{opacity:0;transform:scale(.2)}
  25%{opacity:1;transform:scale(1.1)}
  100%{opacity:0;transform:scale(2)}
}
@media(max-width:390px){
  .result-stage{padding:5px 5px 16px}
  .result-stage .result{gap:5px}
  .result-stage .car{padding:6px}
  .result-stage .person{padding:6px 5px}
  .result-stage .message{padding:6px;font-size:10px}
}

</style>
</head>
<body>
<div class="wrap">
<header id="setupHeader">
  <span class="kicker">FUJI DRIVER ROULETTE</span>
  <h1>富士山 配車ルーレット</h1>
  <p class="lead">3人・3人 または 4人・2人で配車。サイコロが止まった瞬間に結果発表。</p>
</header>

<section class="panel" id="setupPanel">
  <div class="members">
    <div class="member">いっせい<small>運転手候補生</small></div>
    <div class="member">そえじま<small>運転手候補生</small></div>
    <div class="member">こうじま<small>運転手候補生</small></div>
    <div class="member">わなみ<small>運転手候補生</small></div>
    <div class="member">もりっそ<small>運転手候補生</small></div>
    <div class="member">やっすん<small>運転手候補生</small></div>
  </div>

  <div class="controls">
    <button id="spinBtn" onclick="runRoulette()">ルーレットを回す</button>
    <div class="status" id="status">運転したい人からどうぞ。</div>
  </div>


</section>
</div>


<section class="result-stage" id="resultStage">
  <div class="result-status" id="resultStatus"></div>
  <div class="result" id="result">
    <article class="car" id="car1"></article>
    <article class="car" id="car2"></article>
  </div>
  <div class="result-actions">
    <button id="rerollBtn" type="button" onclick="runRoulette()">もう一度回す</button>
  </div>
</section>

<div class="mori-chaos" id="moriChaos" aria-hidden="true">
  <div class="mori-flash"><strong>責任転嫁！</strong></div>
</div>

<div class="intro" id="intro">
  <div class="chinchiro-wrap">
    <div class="chinchiro-title">チンチロ配車抽選中…</div>
    <div class="bowl" id="bowl">
      <div class="dice rolling" id="dice1"></div>
      <div class="dice rolling" id="dice2"></div>
      <div class="dice rolling" id="dice3"></div>
    </div>
    <div class="countdown" id="countdown">結果発表まで 3.5秒</div>
  </div>
</div>

function shuffle(a){
  a=a.slice();
  for(var i=a.length-1;i>0;i--){
    var j=Math.floor(Math.random()*(i+1));
    var t=a[i];a[i]=a[j];a[j]=t;
  }
  return a;
}

function pick(arr){
  return arr[Math.floor(Math.random()*arr.length)];
}

function displayName(name,isDriver){
  return (name==="そえじま" && isDriver) ? "運転島すき大" : name;
}

function driverResult(group){
  var selected=pick(group);

  if(selected.name==="もりっそ"){
    var candidates=group.filter(function(p){return p.canDrive});
    var real=pick(candidates);
    return {
      actual:real,
      nominal:selected,
      mori:true,
      rare:false,
      text:pick(moriLines)(displayName(real.name,true))
    };
  }

  var rare=Math.random()<0.60;
  var shown=displayName(selected.name,true);

  return {
    actual:selected,
    nominal:selected,
    mori:false,
    rare:rare,
    text:(rare?pick(rareLines):pick(normalLines))(shown)
  };
}

function renderCar(num,group,res,phase){
  var html="<h2>🚙 車"+num+"（"+group.length+"人）</h2>";

  group.forEach(function(p){
    var isInitialMori=res.mori && phase==="initial" && p.name==="もりっそ";
    var isActual=phase==="final" && p.name===res.actual.name;
    var isNormalDriver=!res.mori && p.name===res.actual.name;
    var isFake=res.mori && phase==="final" && p.name==="もりっそ";

    var cls="person";
    var badge="";
    var shownName=displayName(p.name,isInitialMori || isActual || isNormalDriver);

    if(isInitialMori || isActual || isNormalDriver){
      cls+=" driver";
      badge='<span class="badge">運転手</span>';
    }else if(isFake){
      cls+=" fake";
      badge='<span class="badge fake-badge">責任転嫁</span>';
    }

    html+='<div class="'+cls+'"><span>'+shownName+'</span>'+badge+'</div>';
  });

  if(res.mori){
    if(phase==="final"){
      html+='<div class="message mori">'+res.text+"</div>";
    }
  }else{
    html+='<div class="message '+(res.rare?"rare ":"")+'">'+res.text+"</div>";
  }

  return html;
}

function dotsFor(value){
  var positions={
    1:["p5"],
    2:["p1","p9"],
    3:["p1","p5","p9"],
    4:["p1","p3","p7","p9"],
    5:["p1","p3","p5","p7","p9"],
    6:["p1","p3","p4","p6","p7","p9"]
  };
  return positions[value].map(function(pos){
    return '<span class="dot '+pos+'"></span>';
  }).join("");
}

function setDiceValue(id,value){
  document.getElementById(id).innerHTML=dotsFor(value);
}

function randomDicePosition(el,index){
  var positions=[
    {left:"16%",top:"28%",rot:"-18deg"},
    {left:"42%",top:"48%",rot:"12deg"},
    {left:"65%",top:"24%",rot:"27deg"},
    {left:"28%",top:"55%",rot:"-32deg"},
    {left:"58%",top:"52%",rot:"8deg"},
    {left:"43%",top:"20%",rot:"38deg"}
  ];
  var p=positions[Math.floor(Math.random()*positions.length)];
  el.style.left=p.left;
  el.style.top=p.top;
  el.style.transform="rotate("+p.rot+")";
}


function createMoriFaces(){
  var overlay=document.getElementById("moriChaos");
  var oldFaces=overlay.querySelectorAll(".mori-face");
  oldFaces.forEach(function(el){el.remove();});

  var count=Math.max(28,Math.min(52,Math.floor(window.innerWidth/10)));
  for(var i=0;i<count;i++){
    var face=document.createElement("img");
    face.className="mori-face";
    face.src=MORI_FACE;
    face.alt="";
    var size=56+Math.random()*82;
    face.style.width=size+"px";
    face.style.height=size+"px";
    face.style.left=(Math.random()*102-6)+"vw";
    face.style.setProperty("--delay",(Math.random()*.75)+"s");
    face.style.setProperty("--duration",(.85+Math.random()*.65)+"s");
    face.style.setProperty("--fall",(72+Math.random()*34)+"vh");
    face.style.setProperty("--rotate",(-220+Math.random()*440)+"deg");
    face.style.setProperty("--blast-x",(-70+Math.random()*140)+"vw");
    face.style.setProperty("--blast-y",(-55+Math.random()*110)+"vh");
    overlay.appendChild(face);
  }
}

function playMoriTransfer(callback){
  var overlay=document.getElementById("moriChaos");
  createMoriFaces();
  overlay.classList.remove("explode");
  overlay.classList.add("active");
  overlay.setAttribute("aria-hidden","false");

  setTimeout(function(){
    overlay.classList.add("explode");
  },1450);

  setTimeout(function(){
    overlay.classList.remove("active","explode");
    overlay.setAttribute("aria-hidden","true");
    callback();
  },2150);
}

function showResultScreen(){
  document.getElementById("setupHeader").classList.add("setup-hidden");
  document.getElementById("setupPanel").classList.add("setup-hidden");
  document.getElementById("resultStage").style.display="block";
  document.getElementById("result").style.display="grid";
  window.scrollTo({top:0,behavior:"instant"});
}

function runRoulette(){
  var btn=document.getElementById("spinBtn");
  var rerollBtn=document.getElementById("rerollBtn");
  var intro=document.getElementById("intro");
  var result=document.getElementById("result");
  var resultStage=document.getElementById("resultStage");
  var status=document.getElementById("status");
  var resultStatus=document.getElementById("resultStatus");
  var countdown=document.getElementById("countdown");

  btn.disabled=true;
  rerollBtn.disabled=true;
  resultStage.style.display="none";
  result.style.display="none";
  intro.style.display="flex";
  status.textContent="チンチロ抽選中…";

  var diceEls=[
    document.getElementById("dice1"),
    document.getElementById("dice2"),
    document.getElementById("dice3")
  ];

  diceEls.forEach(function(el,i){
    el.classList.add("rolling");
    randomDicePosition(el,i);
    setDiceValue(el.id,Math.floor(Math.random()*6)+1);
  });

  var rollingTimer=setInterval(function(){
    diceEls.forEach(function(el,i){
      randomDicePosition(el,i);
      setDiceValue(el.id,Math.floor(Math.random()*6)+1);
    });
  },240);

  var remaining=3.5;
  countdown.textContent="結果発表まで 3.5秒";
  var timer=setInterval(function(){
    remaining-=0.5;
    if(remaining>0){
      countdown.textContent="結果発表まで "+remaining.toFixed(1)+"秒";
    }
  },500);

  setTimeout(function(){
    clearInterval(timer);
    clearInterval(rollingTimer);

    var finalDice=[
      Math.floor(Math.random()*6)+1,
      Math.floor(Math.random()*6)+1,
      Math.floor(Math.random()*6)+1
    ];

    var stopPositions=[
      {left:"20%",top:"34%",rot:"-8deg"},
      {left:"44%",top:"50%",rot:"10deg"},
      {left:"65%",top:"31%",rot:"18deg"}
    ];

    diceEls.forEach(function(el,i){
      el.classList.remove("rolling");
      el.style.left=stopPositions[i].left;
      el.style.top=stopPositions[i].top;
      el.style.transform="rotate("+stopPositions[i].rot+")";
      setDiceValue(el.id,finalDice[i]);
    });

    countdown.textContent="出目決定！";
    intro.classList.add("flash");

    var mixed=shuffle(members);
    var split=Math.random()<0.5 ? 3 : (Math.random()<0.5 ? 2 : 4);
    var g1=mixed.slice(0,split);
    var g2=mixed.slice(split);
    var d1=driverResult(g1);
    var d2=driverResult(g2);

    document.getElementById("car1").innerHTML=renderCar(1,g1,d1,d1.mori?"initial":"final");
    document.getElementById("car2").innerHTML=renderCar(2,g2,d2,d2.mori?"initial":"final");

    setTimeout(function(){
      intro.style.display="none";
      intro.classList.remove("flash");
      showResultScreen();
      resultStatus.textContent="配車決定。運転したかった人、おめでとうございます。";

      var hasMori=d1.mori || d2.mori;

      if(hasMori){
        resultStatus.textContent="もりっそが運転手に当選しました。";
        setTimeout(function(){
          playMoriTransfer(function(){
            if(d1.mori){
              document.getElementById("car1").innerHTML=renderCar(1,g1,d1,"final");
            }
            if(d2.mori){
              document.getElementById("car2").innerHTML=renderCar(2,g2,d2,"final");
            }
            resultStatus.textContent="もりっそ、責任転嫁完了。新しい運転手が決まりました。";
            btn.textContent="もう一度回す";
            btn.disabled=false;
            rerollBtn.disabled=false;
          });
        },2000);
      }else{
        btn.textContent="もう一度回す";
        btn.disabled=false;
        rerollBtn.disabled=false;
      }
    },300);
  },3500);
}
